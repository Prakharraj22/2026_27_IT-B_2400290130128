version: '3.8'

services:
  postgres_test:
    image: pgvector/pgvector:pg15
    container_name: career_intel_postgres_test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: career_intel_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d career_intel_test"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis_test:
    image: redis:7-alpine
    container_name: career_intel_redis_test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
